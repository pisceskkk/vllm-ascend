pr: 19109
entries:
  - category: bugfix
    text: Model Runner V2 refreshes pooled token and block ID buffers after NumPy concatenation when using the explicit host-to-device copy fallback on vLLM main.
    hardware: [950, 910_93]
  - category: feature
    text: Added experimental HiSparse host KV caching for sparse MLA on Ascend 950 and 910_93 with Model Runner V2, BF16 indexer KV and unquantized main KV. Host pools are allocated separately for each worker rank.
    hardware: [950, 910_93]
  - category: performance
    text: HiSparse prefill uses two contiguous staging planes and paged SFA with fused causal index preparation, removing per-query KV expansion and repeated attention launches.
    hardware: [950, 910_93]
  - category: performance
    text: HiSparse host, resident and hot caches share a split latent/RoPE layout within the existing KV budget. Native preprocessing writes both planes directly, and fully resident batches skip staging through the existing SFA interface.
    hardware: [950, 910_93]
  - category: bugfix
    text: HiSparse keeps CPU thread affinity without migrating registered host KV pools during worker warmup, avoiding long NUMA migration scans of pinned pages.
    hardware: [950, 910_93]
  - category: performance
    text: HiSparse on Ascend 910_93 uses vectorized device sort and gather for large prefill index compaction and state-aware hot-cache invalidation, avoiding scalar scans proportional to prompt length.
    hardware: [910_93]
